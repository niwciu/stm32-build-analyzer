name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run extension-host tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: Run extension-host tests on Windows
        if: runner.os == 'Windows'
        run: npm test

      - name: Audit runtime dependencies
        if: runner.os == 'Linux'
        run: npm audit --omit=dev

      - name: Audit all dependencies
        if: runner.os == 'Linux'
        run: npm audit

      - name: Build production bundles
        if: runner.os == 'Linux'
        run: npm run package

      - name: Package VSIX
        if: runner.os == 'Linux'
        run: npm run vsix -- --out stm32-build-analyzer-enhanced.vsix

      - name: Validate VSIX contents
        if: runner.os == 'Linux'
        run: |
          unzip -Z1 stm32-build-analyzer-enhanced.vsix > vsix-contents.txt
          grep -Fx 'extension/package.json' vsix-contents.txt
          grep -Fx 'extension/dist/extension.js' vsix-contents.txt
          grep -Fx 'extension/dist/build-analyzer.bundle.js' vsix-contents.txt
          if grep -E '(^extension/(src|webview|node_modules)/|\.map$|\.ts$|post-issue-10-)' vsix-contents.txt; then
            echo 'Unexpected development file found in VSIX.'
            exit 1
          fi
