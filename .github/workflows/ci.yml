name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run extension-host tests
        run: xvfb-run -a npm test

      - name: Audit runtime dependencies
        run: npm audit --omit=dev

      - name: Build production bundles
        run: npm run package

      - name: Package VSIX
        run: npm run vsix -- --out stm32-build-analyzer-enhanced.vsix

      - name: Validate VSIX contents
        run: |
          unzip -l stm32-build-analyzer-enhanced.vsix | grep 'extension/package.json'
          unzip -l stm32-build-analyzer-enhanced.vsix | grep 'extension/dist/extension.js'
          unzip -l stm32-build-analyzer-enhanced.vsix | grep 'extension/dist/build-analyzer.bundle.js'
